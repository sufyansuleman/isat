id: vai
name: "Visceral Adiposity Index"
category: lipid
direction: higher_more_resistant
formula_latex: "sex-specific; see docs/v1-methods-spec.md"
inputs: ["waist", "bmi", "tg (mmol/L)", "hdl (mmol/L)", "sex"]
reference:
  citation: "Amato MC, Giordano C, Galia M, Criscimanna A, Vitabile S, Midiri M, Galluzzo A; AlkaMeSy Study Group. Visceral Adiposity Index: a reliable indicator of visceral fat function associated with cardiometabolic risk. Diabetes Care. 2010;33(4):920-922."
  doi: 10.2337/dc09-1825
  pmid: 20067971
  pmcid: PMC2845052
verification:
  status: confirmed
  detail: "Computed for the participant's own sex only."
legacy:
  insusenscalc_column:
    male: VAI_Men_inv
    female: VAI_Women_inv
  relation: negated
  difference: "Legacy computes both sexes for every row and negates."
formula_variants:
  - label: Men
    latex: '\mathrm{VAI} = \frac{WC}{39.68 + 1.88 \times BMI} \times \frac{TG}{1.03} \times \frac{1.31}{HDL}'
  - label: Women
    latex: '\mathrm{VAI} = \frac{WC}{36.58 + 1.89 \times BMI} \times \frac{TG}{0.81} \times \frac{1.52}{HDL}'
notes:
  - "WC in cm; TG and HDL in mmol/L"
source_verification: author_verified_not_rechecked
source_verification_detail: "Formula verified against the original publication by the InsuSensCalc author (NEWS 0.1.0 / Suleman 2024); not re-read for ISAT."
derived_in:
  population: "Healthy non-obese adults; then tested in 1,498 primary-care patients"
  n: "315"
  setting: "Palermo, Sicily, Italy"
